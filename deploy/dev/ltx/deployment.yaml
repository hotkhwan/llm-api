apiVersion: apps/v1
kind: Deployment
metadata: { name: kwanni-ltx, namespace: dev, labels: { app: kwanni-ltx } }
spec:
  replicas: 0
  strategy: { type: Recreate }
  selector: { matchLabels: { app: kwanni-ltx } }
  template:
    metadata: { labels: { app: kwanni-ltx } }
    spec:
      runtimeClassName: nvidia
      automountServiceAccountToken: false
      nodeSelector: { kubernetes.io/arch: arm64 }
      containers:
        - name: ltx
          image: nvcr.io/nvidia/pytorch@sha256:dcae8df08ef61b019b8eb109113428cba4ef0e37484c6e722406150dd5ada759
          command: [/runtime/venv/bin/python]
          args: [/runtime/server.py]
          env:
            - name: LTX_API_KEY
              valueFrom: { secretKeyRef: { name: kwanni-ltx-auth, key: LTX_API_KEY } }
            - { name: LTX_MODEL_DIR, value: /models }
            - { name: LTX_ROOT, value: /runtime/LTX-2 }
            - { name: LTX_GENERATION_TIMEOUT_SECONDS, value: "1200" }
          ports: [{ name: http, containerPort: 8092 }]
          resources:
            requests: { cpu: "8", memory: 64Gi, nvidia.com/gpu: "1" }
            limits: { cpu: "16", memory: 120Gi, nvidia.com/gpu: "1" }
          volumeMounts:
            - { name: model, mountPath: /models, readOnly: true }
            - { name: runtime, mountPath: /runtime, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      volumes:
        - name: model
          hostPath: { path: /opt/local/models/ltx-2.3, type: Directory }
        - name: runtime
          hostPath: { path: /opt/local/runtimes/ltx-2.3, type: Directory }
