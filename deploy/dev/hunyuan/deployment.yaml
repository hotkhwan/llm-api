apiVersion: apps/v1
kind: Deployment
metadata:
  name: kwanni-hunyuan
  namespace: dev
  labels: { app: kwanni-hunyuan }
spec:
  replicas: 0
  strategy: { type: Recreate }
  selector: { matchLabels: { app: kwanni-hunyuan } }
  template:
    metadata: { labels: { app: kwanni-hunyuan } }
    spec:
      runtimeClassName: nvidia
      automountServiceAccountToken: false
      nodeSelector: { kubernetes.io/arch: arm64 }
      containers:
        - name: hunyuan
          image: nvcr.io/nvidia/pytorch@sha256:dcae8df08ef61b019b8eb109113428cba4ef0e37484c6e722406150dd5ada759
          imagePullPolicy: IfNotPresent
          command: [python3]
          args: [/runtime/server.py]
          env:
            - name: HUNYUAN_API_KEY
              valueFrom: { secretKeyRef: { name: kwanni-hunyuan-auth, key: HUNYUAN_API_KEY } }
            - { name: HUNYUAN_MODEL_DIR, value: /models }
            - { name: HUNYUAN_ROOT, value: /runtime/HunyuanVideo-1.5 }
            - { name: PYTHONPATH, value: /runtime/python:/runtime/HunyuanVideo-1.5 }
            - { name: HUNYUAN_GENERATION_TIMEOUT_SECONDS, value: "900" }
          ports: [{ name: http, containerPort: 8091 }]
          resources:
            requests: { cpu: "8", memory: 56Gi, nvidia.com/gpu: "1" }
            limits: { cpu: "16", memory: 112Gi, nvidia.com/gpu: "1" }
          volumeMounts:
            - { name: model, mountPath: /models, readOnly: true }
            - { name: runtime, mountPath: /runtime, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      volumes:
        - name: model
          hostPath: { path: /opt/local/models/hunyuan-video-1.5, type: Directory }
        - name: runtime
          hostPath: { path: /opt/local/runtimes/hunyuan-video-1.5, type: Directory }
