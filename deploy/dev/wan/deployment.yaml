apiVersion: apps/v1
kind: Deployment
metadata:
  name: kwanni-wan
  namespace: dev
  labels: { app: kwanni-wan }
spec:
  replicas: 0
  strategy: { type: Recreate }
  selector: { matchLabels: { app: kwanni-wan } }
  template:
    metadata: { labels: { app: kwanni-wan } }
    spec:
      runtimeClassName: nvidia
      automountServiceAccountToken: false
      nodeSelector: { kubernetes.io/arch: arm64 }
      containers:
        - name: wan
          image: nvcr.io/nvidia/pytorch@sha256:dcae8df08ef61b019b8eb109113428cba4ef0e37484c6e722406150dd5ada759
          imagePullPolicy: IfNotPresent
          command: [python3]
          args: [/runtime/server.py]
          env:
            - name: WAN_API_KEY
              valueFrom: { secretKeyRef: { name: kwanni-wan-auth, key: WAN_API_KEY } }
            - { name: WAN_MODEL_DIR, value: /models }
            - { name: WAN_ROOT, value: /runtime/Wan2.2 }
            - { name: PYTHONPATH, value: /runtime/python:/runtime/overlay:/runtime/Wan2.2 }
            - { name: WAN_GENERATION_TIMEOUT_SECONDS, value: "2700" }
          ports: [{ name: http, containerPort: 8090 }]
          resources:
            requests: { cpu: "8", memory: 48Gi, nvidia.com/gpu: "1" }
            limits: { cpu: "16", memory: 96Gi, nvidia.com/gpu: "1" }
          volumeMounts:
            - { name: model, mountPath: /models, readOnly: true }
            - { name: runtime, mountPath: /runtime, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      volumes:
        - name: model
          hostPath: { path: /opt/local/models/wan2.2-ti2v-5b, type: Directory }
        - name: runtime
          hostPath: { path: /opt/local/runtimes/wan2.2, type: Directory }
