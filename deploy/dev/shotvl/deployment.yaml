apiVersion: apps/v1
kind: Deployment
metadata:
  name: kwanni-shotvl
  labels:
    app.kubernetes.io/name: kwanni-shotvl
    app.kubernetes.io/part-of: kwanni
    app.kubernetes.io/component: visual-qc
spec:
  # Load on demand with scripts/shotvl-runtime.sh. Never make this permanently 1.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kwanni-shotvl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kwanni-shotvl
        app.kubernetes.io/part-of: kwanni
        app.kubernetes.io/component: visual-qc
    spec:
      serviceAccountName: kwanni-shotvl
      # K3s keeps NVIDIA as a named runtime; default runc cannot expose
      # NVML/CUDA on DGX Spark.
      runtimeClassName: nvidia
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vllm
          # NVIDIA's DGX Spark recipe supports this ARM64 NGC vLLM build. Both
          # the multi-arch index and model revision are immutable pins.
          image: nvcr.io/nvidia/vllm:26.05.post1-py3@sha256:94e21552f644e0c1627464ba89d2f7a4ce7442e196f72afa0bb5d7fba23cbb03
          imagePullPolicy: IfNotPresent
          args:
            - vllm
            - serve
            - Vchitect/ShotVL-7B
            - --revision
            - fd8c356e8fd8d116417dddb6acc49fbf45f9abbc
            - --served-model-name
            - shotvl-7b
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --dtype
            - bfloat16
            - --max-model-len
            - "16384"
            - --max-num-seqs
            - "1"
            - --max-num-batched-tokens
            - "16384"
            - --gpu-memory-utilization
            - "0.25"
            - --limit-mm-per-prompt
            - '{"image":12,"video":0}'
            - --mm-processor-kwargs
            - '{"max_pixels":401408,"min_pixels":3136}'
            - --generation-config
            - vllm
            - --disable-fastapi-docs
          env:
            - name: HF_HOME
              value: /models/huggingface
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: VLLM_NO_USAGE_STATS
              value: "1"
            - name: DO_NOT_TRACK
              value: "1"
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kwanni-shotvl-auth
                  key: SHOTVL_API_KEY
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "2"
              memory: 20Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 48Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /models
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          hostPath:
            path: /opt/local/models/shotvl
            type: Directory
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
